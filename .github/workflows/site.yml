name: JISDOR - Update and Publish

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # BI currently publishes JISDOR at 15:15 Asia/Jakarta (08:15 UTC).
    # The second run provides time for delayed publication or schedule drift.
    - cron: '45 8 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '0 3 * * 6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jisdor-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh historical BI data
        if: github.event_name != 'push'
        run: node scripts/update.mjs

      - name: Validate scripts and export
        run: |
          node --check docs/app.js
          node --check docs/xlsx.js
          node --check scripts/update.mjs
          node --check scripts/test.mjs
          node scripts/test.mjs

      - name: Commit updated rate snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jisdor.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh JISDOR historical rates"
            git push origin HEAD:master
          else
            echo "No changes to persist"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
